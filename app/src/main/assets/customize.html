<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Customizer</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#0b0f1a;color:#e8ecf6;padding:16px;max-width:560px;margin:auto}
h1{font-size:22px;font-weight:600;margin:8px 0 16px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#7f8aa8;margin:22px 0 8px}
.card{background:#141a2b;border-radius:14px;padding:6px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #1f2740}
.row:last-child{border-bottom:0}
.row label{font-size:15px}
select,input[type=color]{background:#0b0f1a;color:#e8ecf6;border:1px solid #2a3556;border-radius:8px;padding:7px;font-size:15px}
input[type=range]{width:46%}
button{background:#2a3a6e;color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:14px}
button.on{background:#5b8cff}
.sw{width:46px;height:26px;border-radius:13px;background:#2a3556;position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:.15s}
.sw.on{background:#5b8cff}.sw.on i{left:23px}
#msg{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:13px;color:#9fb0e0}
.app{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #1f2740}
.app span{flex:1;font-size:15px}
.app button{padding:6px 10px;font-size:13px}
</style></head><body>
<h1>TV Customizer</h1>
<div id="ui">Loading...</div>
<div id="msg"></div>
<script>
var S={config:{},apps:[],has:{}},timer=null;
function $(i){return document.getElementById(i)}
function say(t){$('msg').textContent=t}
function save(){clearTimeout(timer);timer=setTimeout(function(){
 fetch('/api/config',{method:'POST',body:JSON.stringify(S.config)}).then(function(){say('Saved')}).catch(function(){say('TV not reachable')})},250)}
function set(k,v){S.config[k]=v;save()}
function g(k,d){return S.config[k]===undefined?d:S.config[k]}
function row(label,el){var r=document.createElement('div');r.className='row';var l=document.createElement('label');l.textContent=label;r.appendChild(l);r.appendChild(el);return r}
function sel(k,d,opts){var s=document.createElement('select');opts.forEach(function(o){var e=document.createElement('option');e.value=o[0];e.textContent=o[1];s.appendChild(e)});s.value=g(k,d);s.onchange=function(){set(k,s.value)};return s}
function tog(k,d){var s=document.createElement('div');s.className='sw'+(g(k,d)?' on':'');s.innerHTML='<i></i>';s.onclick=function(){var v=!g(k,d);s.className='sw'+(v?' on':'');set(k,v)};return s}
function rng(k,d,min,max,step){var r=document.createElement('input');r.type='range';r.min=min;r.max=max;r.step=step;r.value=g(k,d);r.oninput=function(){set(k,parseFloat(r.value))};return r}
function col(k,d){var c=document.createElement('input');c.type='color';c.value=g(k,d);c.oninput=function(){set(k,c.value)};return c}
function card(title,rows){var h=document.createElement('h2');h.textContent=title;$('ui').appendChild(h);var c=document.createElement('div');c.className='card';rows.forEach(function(r){c.appendChild(r)});$('ui').appendChild(c)}
function pick(label,accept,done){var b=document.createElement('button');b.textContent='Choose';var f=document.createElement('input');f.type='file';f.accept=accept;f.style.display='none';
 f.onchange=function(){if(f.files[0])done(f.files[0],function(t){b.textContent=t})};b.onclick=function(){f.click()};var w=document.createElement('div');w.appendChild(b);w.appendChild(f);return row(label,w)}
function up(kind,blob,cb,after){cb('Uploading...');fetch('/upload/'+kind,{method:'POST',body:blob}).then(function(){cb('Done');S.has[kind]=true;after()}).catch(function(){cb('Failed')})}
function toggleIn(k,pk,other){var a=(S.config[k]||[]).slice();var i=a.indexOf(pk);if(i>=0)a.splice(i,1);else a.push(pk);S.config[k]=a;if(other&&i<0){var o=(S.config[other]||[]).filter(function(x){return x!==pk});S.config[other]=o}save()}
function build(){
 $('ui').innerHTML='';
 if(!S.config.stars){S.config.stars=[];['youtube','netflix'].forEach(function(n){S.apps.forEach(function(a){if(a.l.toLowerCase()===n)S.config.stars.push(a.p)})})}
 card('Wallpaper',[
  row('Style',sel('wall','lake',[['lake','Night lake (live)'],['aurora','Aurora (live)'],['drift','Colour drift (live)'],['image','My photo'],['video','My video'],['black','Black']])),
  row('Animate',tog('anim',true)),
  row('Darken',rng('dim',0.2,0,0.8,0.05)),
  pick('Upload photo','image/*',function(f,cb){cb('Preparing...');createImageBitmap(f).then(function(b){var s=Math.min(1,1920/b.width);var c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);c.toBlob(function(bl){up('image',bl,cb,function(){set('wall','image');build()})},'image/jpeg',0.85)})}),
  pick('Upload video (16:9 mp4)','video/*',function(f,cb){up('video',f,cb,function(){set('wall','video');build()})})
 ]);
 card('Layout',[
  row('Style',sel('layout','row',[['row','Single row'],['grid','Grid']])),
  row('Row position',sel('pos','bottom',[['bottom','Bottom'],['center','Middle']])),
  row('Tile size',rng('size',1,0.6,1.6,0.05)),
  row('Corner roundness',rng('radius',18,0,40,1)),
  row('Show names',tog('labels',true)),
  row('Highlight colour',col('accent','#ffffff'))
 ]);
 card('Clock',[
  row('Format',sel('clock','12',[['12','12-hour'],['24','24-hour'],['off','Hidden']])),
  row('Show date',tog('date',true)),
  row('Side',sel('clockPos','right',[['right','Right'],['left','Left']]))
 ]);
 card('Sound',[
  row('Navigation sounds',tog('sfx',true)),
  row('Sound volume',rng('sfxVol',0.4,0,1,0.05)),
  row('Background music',tog('music',true)),
  row('Music volume',rng('musicVol',0.25,0,1,0.05)),
  row('Music source',sel('musicSrc','ambient',[['ambient','Calm ambient (built in)'],['custom','My own file']])),
  pick('Upload my music','audio/*',function(f,cb){up('music',f,cb,function(){set('musicSrc','custom');build()})})
 ]);
 var rows=[];
 S.apps.forEach(function(a){
  var d=document.createElement('div');d.className='app';var n=document.createElement('span');n.textContent=a.l;d.appendChild(n);
  var st=document.createElement('button');var starred=(S.config.stars||[]).indexOf(a.p)>=0;st.textContent=starred?'\u2605 Starred':'\u2606 Star';st.className=starred?'on':'';
  st.onclick=function(){toggleIn('stars',a.p,null);build()};
  var hd=document.createElement('button');var hidden=(S.config.hidden||[]).indexOf(a.p)>=0;hd.textContent=hidden?'Hidden':'Hide';hd.className=hidden?'on':'';
  hd.onclick=function(){toggleIn('hidden',a.p,null);build()};
  d.appendChild(st);d.appendChild(hd);rows.push(d)});
 card('Apps (starred ones come first)',rows)
}
fetch('/api/state').then(function(r){return r.json()}).then(function(s){S=s;build()}).catch(function(){$('ui').textContent='Could not reach the TV. Is the Customize card still open?'})
</script></body></html>
